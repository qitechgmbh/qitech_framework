qms_version: 1.0
revision: 1

identification:
  name: laser_v1
  vendor_id: 1
  machine_id: 6

config:
  diameter:
    target: !millimeter

    target_default: !?millimeter
    target_enabled: !?boolean
    target_min: !?millimeter
    target_max: !?millimeter

    tolerance:
      upper: !millimeter
      lower: !millimeter

  subscribed:
    diameter:
      target: !?millimeter

      tolerance:
        lower: !?millimeter
        upper: !?millimeter

state:
  in_tolerance: !boolean
  subscribed.in_tolerance: !?boolean

measurements:
  diameter: !millimeter
    statistics:
      min: true
      max: true
      avg: true

  diameter_x: !millimeter
  diameter_y: !millimeter
  roundness:  !millimeter

  # subscribed test
  subscribed.diameter:   !?millimeter
  subscribed.diameter_x: !?millimeter
  subscribed.diameter_y: !?millimeter
  subscribed.roundness:  !?millimeter

events: 
  my_event: !event
    some: !boolean

    list: !?list !?millimeter