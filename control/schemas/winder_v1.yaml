qms_version: 1.0
revision: 1

identification:
  name: winder_v1
  vendor_id: 1
  machine_id: 2

config:
  # traverse config
  traverse:
    padding: !float
      default: 0.0

    step_size: !float
      default: 0.0

    limit_outer: !float
      default: 0.0

    limit_inner: !float
      default: 0.0

  # puller config
  puller:
    speed_target: !float
      default: 0.0

    diameter_target: !float
      default: 0.0

    regulation: !enum
      variants: [speed, diameter]
      default: speed

    direction: !enum
      variants: [forward, reverse]
      default: forward

    gear_ratio: !enum
      variants: [one_to_one, one_to_five, one_to_ten]
      default: one_to_one

  # spool config
  spool:
    direction: !enum
      variants: [forward, reverse]
      default: forward

    speed_control_mode: !enum
      variants: [adaptive, min_max]
      default: adaptive

    adaptive_speed_control:
      tension_target: !float
        default: 0.0

      radius_learning_rate: !float
        default: 0.0

      speed_multiplier_max: !float
        default: 1.0

      acceleration_factor: !float
        default: 1.0

      deacceleration_urgency_multiplier: !float
        default: 1.0

    speed_control:
      mode: !enum
        variants: [adaptive, min_max]
        default: adaptive

      min_max:
        speed_min: !float
          default: 0.0

        speed_max: !float
          default: 0.0

    auto_action:
      required_distance: !meter
        default: 0.0

      action: !enum
        variants: [none, pull, hold]
        default: none


state:
  # tension arm
  tension_arm:
    zero: !boolean
      nullable: true

  # travserse state
  travserse:
    laser:
      enabled: !boolean

    is_going_in: !boolean
    is_going_out: !boolean
    is_going_home: !boolean
    is_traversing: !boolean

  # puller state


measurements:
  traverse:
    position: !millimeter
  
  puller:
    speed: !meter_per_minute

  spool:
    rpm: !revolution_per_minute

    auto_action:
      progress: !meter

  tension_arm:
    angle: !revolution

commands:
  enter_standby: !command
  enter_hold:    !command
  start_pulling: !command
  start_winding: !command

  tension_arm: 
    zero_angle: !command

  traverse:
    goto_home: !command
    goto_limit_outer: !command
    goto_limit_inner: !command

  spool_auto_stop:
    reset_progress: !command
    
  laser:
    enable: !command
    disable: !command

events:
  

# machines/winder_v1/0/config/spool.direction GET/SET
# machines/winder_v1/0/commands/laser.enable POST

# machines/winder_v1/0/laser.enable / POST
# machines/winder_v1/0/spool.direction GET/PUT