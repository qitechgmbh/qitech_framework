[workspace]
members = [
    # "examples/minimal_machines/*", 
    # "examples/concepts/*",
    "qitech_framework",
    "qitech_framework_core",
    "qitech_framework_macros",
    # "hub",
    # "tui",
    # "minimal"
]
resolver = "2"

[workspace.package]
repository = "https://github.com/qitechgmbh/qitech_framework"
keywords = ["ethercat", "machine", "tui"]
categories = [""]
license = "LGPL-3.0-only"
exclude = [".github", ".vscode"]
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
qitech_lib = { git = "https://github.com/qitechgmbh/qitech_lib.git", rev="530355c00baf6335f6085441c2a497d9ac060af6" }
qitech_framework = { path = "qitech_framework", version = "0.1.0" }
qitech_framework_tui = { path = "qitech_framework_tui", version = "0.1.0" }
qitech_framework_core = { path = "qitech_framework_core", version = "0.1.0" }
qitech_framework_macros = { path = "qitech_framework_macros", version = "0.1.0" }

bitvec = "1"
serde = { version = "1.0.217", default-features = false, features = ["derive"]}
tokio = { version = "1", features = ["full"] }
chrono= { version = "0.4.45", features = ["serde"]}
anyhow = "1.0.103"
thiserror = "2.0.19"
tokio-serial = "5.5.0"
serialport = "4.9.0"
heapless = "0.9.3"
udev = "0.9.3"
regex = "1.13.1"

futures = { version = "0.3.33", features = ["std"] }
crossbeam = { version = "0.8.4" }
indexmap = { version = "2", default-features = false, features = ["serde"] }
serde_json = "1.0.150"
yaml_serde = { version = "0.10.4", default-features = false }

toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
unic-langid = { version = "0.9.6", default-features = false, features = ["serde"] }
postcard = { version = "1.1.3", features = ["alloc"] }
bytes = { version = "1.12.1"  }

tokio-util = { version = "0.7.19", features = ["codec"] }

# macros
syn = "3.0.2"
quote = "1"
proc-macro2 = "1"
heck = "0.5.0"