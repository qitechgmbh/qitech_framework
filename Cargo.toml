[workspace]
members = [
    "core",
    "minimal",
    # "macros",
    "library",
    # "hub",
    "tui",
]
resolver = "2"

[workspace.dependencies]
qitech_lib = { git = "https://github.com/qitechgmbh/qitech_lib.git", rev="2ca54835250bcc5a24e50e20aa55ffc0f264033c" }

# qitech_lib = { git = "https://github.com/qitechgmbh/qitech_lib.git", rev="6065961ae2ed53ccd2cc6a1d8c232674d55db8de" }
serde = { version = "1.0.217", default-features = false, features = ["derive"]}
tokio = { version = "1", features = ["full"] }
chrono= { version = "0.4.45", features = ["serde"]}
anyhow = "1.0.103"
thiserror = "2.0.19"

futures = { version = "0.3.33", features = ["std"] }

indexmap = { version = "2", default-features = false, features = ["serde"] }
serde_json = "1.0.150"
yaml_serde = { version = "0.10.4", default-features = false }

tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }