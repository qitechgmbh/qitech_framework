[workspace]
members = [
    "examples/apps/*", 
    # "examples/concepts/*",
    "qitech_framework",
    "qitech_framework_hub",
    "qitech_framework_tui",
    "qitech_framework_core",
    "qitech_framework_macros",
]
resolver = "2"

[workspace.package]
repository = "https://github.com/qitechgmbh/qitech_framework"
keywords = ["ethercat", "modbus", "machine", "tui"]
categories = [""]
license = "LGPL-3.0-only"
exclude = [".github", ".vscode"]
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
qitech_framework = { path = "qitech_framework", version = "0.1.0" }
qitech_framework_tui = { path = "qitech_framework_tui", version = "0.1.0" }
qitech_framework_hub = { path = "qitech_framework_hub", version = "0.1.0" }
qitech_framework_core = { path = "qitech_framework_core", version = "0.1.0" }
qitech_framework_macros = { path = "qitech_framework_macros", version = "0.1.0" }

anyhow = "1.0.103"
arc-swap = "1.9.2"
axum = "0.8"
bitvec = "1"
bytes = "1.12.1"
chrono = "0.4.45"
clickhouse = "0.15.1"
crossbeam = "0.8.4"
futures = "0.3.33"
heck = "0.5.0"
heapless = "0.9.3"
indexmap = "2"
postcard = "1.1.3"
proc-macro2 = "1"
quote = "1"
regex = "1.13.1"
serde = "1.0.217"
serde_json = "1.0.150"
serialport = "4.9.0"
syn = "3.0.2"
testcontainers = "0.27.3"
thiserror = "2.0.19"
tokio = "1"
tokio-serial = "5.5.0"
tokio-util = "0.7.19"
toml = "1.1.4"
tower-http = "0.6.8"
tracing = "0.1.44"
tracing-subscriber = "0.3"
unic-langid = "0.9.6"
uuid = "1.24.0"
yaml_serde = "0.10.4"
qitech_lib = { git = "https://github.com/qitechgmbh/qitech_lib.git", rev="11f0a983a1119cb2b4e93b81b77d200010db55bd" }
