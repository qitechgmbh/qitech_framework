  measurements:
    current_temperature:
      EN-us: "Current temperature"
      DE-de: "Aktuelle Temperatur"

    ambient_temperature:
      EN-us: "Ambient temperature"
      DE-de: "Umgebungstemperatur"

  commands:
    start_heating:
      EN-us: "Start heating"
      DE-de: "Heizung starten"

    stop_heating:
      EN-us: "Stop heating"
      DE-de: "Heizung stoppen"

    start_cooling:
