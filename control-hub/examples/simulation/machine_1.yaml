qms_version: 1.0

name: temperature_controller
schema_revision: 1

identification:
  vendor: 1
  machine: 20

config:
  temperature: 
    target: !degree_celsius
      default: 22.0

    tolerance: !degree_celsius
      default: 1.0

state:
  heating: !boolean
  cooling: !boolean

measurements:
  temperature:
    current: !degree_celsius
    ambient: !degree_celsius

commands:
  start_heating:
  stop_heating:
  start_cooling:
  stop_cooling:

description:
  config:
    target_temperature:
