[package]
name = "qitech_framework_core"
version = "0.1.0"
rust-version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# --- general ---
serde.workspace = true
thiserror.workspace = true

# --- schema ---
indexmap = { workspace = true, features = ["serde"], optional = true  }
yaml_serde  = { workspace = true, optional = true }
unic-langid = { workspace = true, features = ["serde"], optional = true  }

# --- protocol ---
chrono = { workspace = true, features = ["serde"] }
postcard = { workspace = true, features = ["alloc"] }

# --- tokio link ---
tokio = { workspace = true, features = ["sync", "net", "io-util"], optional = true }

[build-dependencies]
serde = { workspace = true, features = ["derive"] }
toml.workspace = true

[features]
default = ["schema", "link_tokio"]
schema = ["dep:yaml_serde", "dep:indexmap", "dep:unic-langid"]

link_tokio = ["dep:tokio"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "sync", "net", "io-util"] }
