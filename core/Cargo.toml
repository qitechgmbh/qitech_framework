[package]
name = "qitech_framework_core"
version = "0.1.0"
edition = "2024"

[dependencies]
# general
serde = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }

# --- schema ---
indexmap = { version = "2", default-features = false, features = ["serde"], optional = true }
yaml_serde = { version = "0.10.4", default-features = false, optional = true }
unic-langid = { version = "0.9.6", default-features = false, features = ["serde"], optional = true }

# --- session general ---
postcard = { version = "1.1.3", features = ["alloc"]}

# --- crossbeam session ---
crossbeam = { version = "0.8.4", optional = true }

# --- unix session ---
futures = { version = "0.3.33", features = ["std"], optional = true  }
tokio = { workspace = true, optional = true }
tokio-util = { version = "0.7.19", features = ["codec"], optional = true }
bytes = { version = "1.12.1", optional = true  }

[build-dependencies]
serde = { workspace = true }
toml = "1.1.2"

[features]
default = ["schema", "session_crossbeam", "session_unix"]
schema = ["dep:yaml_serde", "dep:indexmap", "dep:unic-langid"]

session_crossbeam = ["dep:crossbeam"]
session_unix = ["dep:tokio", "dep:tokio-util", "dep:futures", "dep:bytes"]