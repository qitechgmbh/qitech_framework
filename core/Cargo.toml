[package]
name = "qitech_framework_core"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }

# --- report ---
soa_derive = "0.14.0"
futures = { version = "0.3.33", features = ["std"] }

# --- schema ---
yaml_serde = { version = "0.10.4", default-features = false, optional = true }
indexmap = { version = "2", default-features = false, features = ["serde"], optional = true }
unic-langid = { version = "0.9.6", default-features = false, features = ["serde"], optional = true }
crossbeam = "0.8.4"
tokio-util = { version = "0.7.19", features = ["codec"]}
postcard = { version = "1.1.3", features = ["alloc"]}
async-trait = "0.1.91"
bytes = "1.12.1"

[build-dependencies]
serde = { workspace = true }
toml = "1.1.2"

[features]
default = ["schema"]
schema = ["dep:yaml_serde", "dep:indexmap", "dep:unic-langid"]
