qms_version: 1.0
revision: 4

identification:
  name: winding_machine
  vendor_id: 12
  machine_id: 4501

config:
  machine:
    enabled: !?boolean

    mode: !enum [manual, setup, automatic]

  spindle:
    max_speed: !revolution_per_minute
    acceleration: !meter_per_second_squared

  laser:
    power: !percentage
    diameter: !millimeter

  material:
    thickness: !millimeter
    density: !kilogram

state:
  machine:
    status: !enum [idle, running, paused, fault]

    active_recipe: !string

  spindle:
    speed: !revolution_per_minute
    load: !percentage

  axis:
    position_x: !millimeter
    position_y: !millimeter
    position_z: !millimeter


measurements:
  temperature: !degree_celsius
  humidity: !percentage

  spindle:
    torque: !ratio
    vibration: !millimeter

  energy:
    current: !ampere
    voltage: !volt
    frequency: !hertz


commands:
  reset: !command
  
  emergency_stop: !command

  spindle:
    start: !command
    stop: !command
    set_speed: !command

  axis:
    move_absolute: !command
    jog: !command

  recipe:
    load: !command

events:
  machine_started: !event
    operator: !string

  machine_stopped: !event
    reason: !enum [operator, alarm, emergency]

  spindle:
    started: !event
      speed: !revolution_per_minute

    overloaded: !event
      load: !percentage
      duration: !second


  alarm: !event
    code: !integer

    details: !object
      message: !string
      severity: !enum [warning, error, critical]

  production_completed: !event
    count: !integer
    duration: !second

  complex: !event
    content: !list !list !object
      bomba: !integer

  complex_2: !event
    content: !list !list !enum [
      hello,
      world
    ]

  complex_3: !event
    content: !list !list !?enum 
    [
      hello,
      world,
    ]

  complex_4: !event
    content: !?list !?list !?enum 
      - hello
      - world

metadata:
  config:
    spindle:
      max_speed:
        description:
          en-US: "Maximum spindle speed"
          de-DE: "Maximale Spindeldrehzahl"

    laser:
      diameter:
        description:
          en-US: "Laser spot diameter"


  commands:
    axis:
      move_absolute:
        description:
          en-US: "Move axis to absolute position"


  events:
    alarm:
      description:
          en-US: "Machine alarm event"