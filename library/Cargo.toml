[package]
name = "qitech_framework"
version = "0.1.0"
edition = "2024"

[dependencies]
# --- internal deps ---
qitech_framework_common = { path = "../common" }
# qitech_framework_hub = { path = "../control-macros" }

# --- workspace deps ---
serde = { workspace = true }
serde_json = { workspace = true }

anyhow = { workspace = true }
chrono = { workspace = true }
qitech_lib = { workspace = true }

# --- unique deps ---
postcard = { version = "1.1.3", features = ["alloc"]}
heapless = { version = "0.8.0", features = ["serde"]}
serialport = "4.9.0"
udev = "0.9.3"
tokio-serial = "5.5.0"
bitvec = "1"

# --- uom ---
uom = { version = "0.38.0", default-features = false, features = [ "f64" ] }

[build-dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[features]
default = []
runtime = []