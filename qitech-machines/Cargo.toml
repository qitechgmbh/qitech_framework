[package]
name = "qitech_machines"
version = "0.1.0"
edition = "2024"

[dependencies]
# --- internal deps ---
control_hub = { path = "../control-hub" }
control_runtime = { path = "../control-runtime" }

# --- workspace deps ---
serde = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
qitech_lib = { workspace = true }

# --- unique deps ---
postcard = { version = "1.1.3", features = ["alloc"]}
heapless = { version = "0.8.0", features = ["serde"]}
serialport = "4.9.0"
udev = "0.9.3"