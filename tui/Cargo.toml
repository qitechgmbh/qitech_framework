[package]
name = "qitech_framework_tui"
version = "0.1.0"
edition = "2024"

[dependencies]
# --- internal deps ---
qitech_framework_common = { path = "../common" }
qitech_framework = { path = "../library" }

# --- workspace deps ---
serde = { workspace = true }
serde_json = { workspace = true }
yaml_serde = { workspace = true }

tokio = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
qitech_lib = { workspace = true }
thiserror = { workspace = true }

# --- unique deps ---
postcard = { version = "1.1.3", features = ["alloc"]}
heapless = { version = "0.9.3", features = ["serde"]}
serialport = "4.9.0"
udev = "0.9.3"
tokio-serial = "5.5.0"
bitvec = "1"

# TODO: common should export IndexMap or provide other struct
indexmap = { version = "2", default-features = false, features = ["serde"] }

# --- uom ---
crossbeam = "0.8.4"
tracing.workspace = true
ratatui = "0.30.2"
crossterm = "0.29.0"

[build-dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[features]
default = []
runtime = []
